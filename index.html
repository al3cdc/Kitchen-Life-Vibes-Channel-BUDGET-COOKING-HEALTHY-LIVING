<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Life Vibes Channel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background Decorative Shapes -->
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>
  <div class="bg-shape shape-3"></div>

  <!-- Raining Chef Hats Background Elements -->
  <div class="floating-item">👨‍🍳</div>
  <div class="floating-item">👨‍🍳</div>
  <div class="floating-item">👨‍🍳</div>
  <div class="floating-item">👨‍🍳</div>
  <div class="floating-item">👨‍🍳</div>
  <div class="floating-item">👨‍🍳</div>

  <!-- Header Branding with Blinking SCA 9-3 -->
  <!-- Header Branding with Blinking SCA 9-3 -->
  <header>
    <div class="brand">
      <div class="brand-icon">
        <img src="https://uploads.onecompiler.io/43tjxwqya/44cjykqm3/c40a515d-6734-4cc8-87d5-b2c7b31cc698-Photoroom.png" alt="Logo" class="logo-img">
      </div>
      <div class="brand-text">
        <span class="brand-title">KITCHEN LIFE VIBES CHANNEL</span>
        <span class="brand-subtitle">GROUP 1 ー <span class="blink-text">SCA 9-3</span></span>
      </div>
    </div>
  </header>

  <!-- Hero Landing Section -->
  <main class="hero-container">
    <div class="hero-card">
      <span class="sparkle top-left">+</span>
      <span class="sparkle top-right">✦</span>
      <span class="sparkle bottom-left">+</span>
      <span class="sparkle bottom-right">✦</span>

      <h1>WELCOME TO</h1>
      <h2 class="hero-subtitle">KITCHEN LIFE VIBES CHANNEL</h2>
      
      <!-- Dynamic Welcome Message Container -->
      <p id="subtitleText"></p>
      
      <button class="btn-start" id="getStartedBtn">GET STARTED</button>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-left">
      TLE-LL 9 EG-12 T2 | <strong>Made by: Alec Dela Cruz</strong>
    </div>
  </footer>

  <!-- Onboarding Modal -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-card">
      <h3>Nice to meet you!</h3>
      <form id="loginForm">
        
        <!-- 1. Name Input -->
        <div class="input-group">
          <label for="userName">What should we call you?</label>
          <input type="text" id="userName" placeholder="e.g., Klla" required>
        </div>

        <!-- 2. Experience Level (Radio Buttons) -->
        <div class="input-group">
          <label>What's your experience level in the kitchen? <span class="sub-label">(Select one)</span></label>
          <div class="option-list">
            <label class="radio-option">
              <input type="radio" name="experience" value="Beginner" required>
              <span><strong>Beginner:</strong> "I rarely cook / I'm just getting started."</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="experience" value="Intermediate">
              <span><strong>Intermediate:</strong> "I can follow basic recipes with ease."</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="experience" value="Advanced">
              <span><strong>Advanced:</strong> "I'm confident in the kitchen and like to experiment."</span>
            </label>
          </div>
        </div>

        <!-- 3. Help Preferences (Checkboxes) -->
        <div class="input-group">
          <label>What would you like help with? <span class="sub-label">(Select all that apply)</span></label>
          <div class="option-list">
            <label class="checkbox-option">
              <input type="checkbox" name="help" value="Learning to Cook">
              <span><strong>Learning to Cook:</strong> Simple, step-by-step guides for beginners</span>
            </label>
            <label class="checkbox-option">
              <input type="checkbox" name="help" value="Eliminating Indecision">
              <span><strong>Eliminating Indecision:</strong> Quick and easy ideas for every meal</span>
            </label>
            <label class="checkbox-option">
              <input type="checkbox" name="help" value="Eating Healthier">
              <span><strong>Eating Healthier:</strong> Nutritious, well-balanced meals made simple</span>
            </label>
            <label class="checkbox-option">
              <input type="checkbox" name="help" value="Saving Ingredients">
              <span><strong>Saving Ingredients:</strong> Smarter ways to waste less food and money</span>
            </label>
          </div>
        </div>

        <button type="submit" class="btn-submit">CONTINUE</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
